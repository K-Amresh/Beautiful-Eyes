<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">Beautiful Eyes compile time vs runtime architecture</title>
  <desc id="desc">Build time compiles .template.be to a JS array. Runtime constructs the component, View builds DOM and bindings, bootstrap appends, then a state write walks the Map.</desc>
  <rect width="760" height="620" fill="#0f1115"/>

  <text x="190" y="28" text-anchor="middle" fill="#7c9dff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">COMPILE TIME</text>
  <text x="570" y="28" text-anchor="middle" fill="#7c9dff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">RUNTIME</text>

  <rect x="24" y="40" width="332" height="44" rx="8" fill="#161922" stroke="#262b38"/>
  <text x="190" y="67" text-anchor="middle" fill="#e7e9ee" font-family="SF Mono, Menlo, monospace" font-size="12">counter.template.be</text>

  <line x1="190" y1="84" x2="190" y2="104" stroke="#7c9dff" stroke-width="1.5"/>
  <rect x="24" y="104" width="332" height="44" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="190" y="131" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12">Lexer + Parser + Stringify</text>

  <line x1="190" y1="148" x2="190" y2="168" stroke="#7c9dff" stroke-width="1.5"/>
  <rect x="24" y="168" width="332" height="56" rx="8" fill="#2a3358" stroke="#7c9dff"/>
  <text x="190" y="192" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">JS array on the module</text>
  <text x="190" y="210" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">HtmlObj, functions, directives</text>

  <rect x="404" y="40" width="332" height="44" rx="8" fill="#161922" stroke="#262b38"/>
  <text x="570" y="67" text-anchor="middle" fill="#e7e9ee" font-family="SF Mono, Menlo, monospace" font-size="12">new Counter()</text>

  <line x1="570" y1="84" x2="570" y2="104" stroke="#7c9dff" stroke-width="1.5"/>
  <rect x="404" y="104" width="332" height="44" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="570" y="131" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12">@State accessors / Proxify</text>

  <line x1="570" y1="148" x2="570" y2="168" stroke="#7c9dff" stroke-width="1.5"/>
  <rect x="404" y="168" width="332" height="56" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="570" y="192" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">View.buildNodeTree</text>
  <text x="570" y="210" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">DOM + reactiveElements Map</text>

  <line x1="570" y1="224" x2="570" y2="244" stroke="#7c9dff" stroke-width="1.5"/>
  <rect x="404" y="244" width="332" height="44" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="570" y="271" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12">init() hooks otherSubscriptions</text>

  <line x1="570" y1="288" x2="570" y2="308" stroke="#7c9dff" stroke-width="1.5"/>
  <rect x="404" y="308" width="332" height="44" rx="8" fill="#2a3358" stroke="#7c9dff"/>
  <text x="570" y="335" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12">bootstrap appends view.root</text>

  <line x1="356" y1="196" x2="404" y2="196" stroke="#262b38" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="380" y="188" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">import</text>

  <rect x="24" y="244" width="332" height="108" rx="8" fill="#161922" stroke="#262b38"/>
  <text x="190" y="272" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">packages that own this</text>
  <text x="190" y="294" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">template-compiler  webpack loader</text>
  <text x="190" y="312" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">never runs in the browser</text>
  <text x="190" y="330" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">View never sees source text</text>

  <text x="380" y="390" text-anchor="middle" fill="#7c9dff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">ONE TICK  --  this.count++</text>

  <rect x="24" y="404" width="172" height="72" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="110" y="432" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1. write</text>
  <text x="110" y="452" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">accessor or Proxy</text>
  <text x="110" y="468" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">this instance only</text>

  <rect x="204" y="404" width="172" height="72" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="290" y="432" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">2. effects</text>
  <text x="290" y="452" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">runSubscribers diffs</text>
  <text x="290" y="468" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">depFn arrays</text>

  <rect x="384" y="404" width="172" height="72" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="470" y="432" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">3. Map walk</text>
  <text x="470" y="452" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">otherSubscriptions</text>
  <text x="470" y="468" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">every updater</text>

  <rect x="564" y="404" width="172" height="72" rx="8" fill="#2a3358" stroke="#7c9dff"/>
  <text x="650" y="432" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">4. DOM</text>
  <text x="650" y="452" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">textContent / attrs</text>
  <text x="650" y="468" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">if / for / props</text>

  <rect x="24" y="496" width="712" height="104" rx="8" fill="#161922" stroke="#262b38"/>
  <text x="380" y="524" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="13" font-weight="700">no virtual DOM, no per-field graph, no shared store</text>
  <text x="380" y="548" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="12">A child component is another ReactiveClass + View + Map.</text>
  <text x="380" y="568" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="12">The only hop across that boundary is applyProps writing @Input fields.</text>
  <text x="380" y="588" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="12">@if / @for are comments + stamps, not hidden elements.</text>
</svg>
