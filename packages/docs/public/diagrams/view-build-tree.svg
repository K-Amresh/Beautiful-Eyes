<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" role="img" aria-labelledby="title desc">
  <title id="title">View.buildNodeTree dispatch, bindings, and directives</title>
  <desc id="desc">Each compiled node becomes a string Text, an interpolation Text with a Map entry, a real element, a child component comment, or an if/for comment whose body is stamped later.</desc>
  <rect width="760" height="580" fill="#0f1115"/>
  <text x="380" y="26" text-anchor="middle" fill="#7c9dff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">View.buildNodeTree(template, args)</text>
  <text x="380" y="44" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">args is [] at the root, [index, item] inside @for</text>

  <rect x="140" y="56" width="480" height="36" rx="8" fill="#2a3358" stroke="#7c9dff"/>
  <text x="380" y="79" text-anchor="middle" fill="#e7e9ee" font-family="SF Mono, Menlo, monospace" font-size="12">for each node in the compiled array</text>

  <line x1="200" y1="92" x2="200" y2="116" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="380" y1="92" x2="380" y2="116" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="560" y1="92" x2="560" y2="116" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="200" y1="92" x2="560" y2="92" stroke="#7c9dff" stroke-width="1.5"/>

  <rect x="40" y="120" width="200" height="72" rx="8" fill="#161922" stroke="#262b38"/>
  <text x="140" y="146" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">string</text>
  <text x="140" y="166" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">createTextNode</text>
  <text x="140" y="182" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">no Map entry</text>

  <rect x="280" y="120" width="200" height="72" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="380" y="146" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">function</text>
  <text x="380" y="166" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">interpolation Text</text>
  <text x="380" y="182" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">Map: textContent = fn()</text>

  <rect x="520" y="120" width="200" height="72" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="620" y="146" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">object</text>
  <text x="620" y="166" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">HtmlObj or DIRECTIVE</text>
  <text x="620" y="182" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">see below</text>

  <line x1="620" y1="192" x2="620" y2="220" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="200" y1="220" x2="620" y2="220" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="200" y1="220" x2="200" y2="236" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="380" y1="220" x2="380" y2="236" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="560" y1="220" x2="560" y2="236" stroke="#7c9dff" stroke-width="1.5"/>

  <rect x="40" y="240" width="200" height="88" rx="8" fill="#161922" stroke="#262b38"/>
  <text x="140" y="264" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">HtmlObj, real tag</text>
  <text x="140" y="284" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">createElement</text>
  <text x="140" y="300" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">events once, attrs +/- Map</text>
  <text x="140" y="316" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">recurse children into el</text>

  <rect x="280" y="240" width="200" height="88" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="380" y="264" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">HtmlObj, registered</text>
  <text x="380" y="284" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">Comment component:Name</text>
  <text x="380" y="300" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">new Child + applyProps</text>
  <text x="380" y="316" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">Map: re-apply $props</text>

  <rect x="520" y="240" width="200" height="88" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="620" y="264" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">DIRECTIVE</text>
  <text x="620" y="284" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">ifElse or for</text>
  <text x="620" y="300" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">Comment if / for</text>
  <text x="620" y="316" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">stamp body, Map updater</text>

  <line x1="140" y1="328" x2="140" y2="356" stroke="#262b38" stroke-width="1.5"/>
  <line x1="620" y1="328" x2="440" y2="356" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="620" y1="328" x2="680" y2="356" stroke="#7c9dff" stroke-width="1.5"/>

  <rect x="40" y="360" width="200" height="72" rx="8" fill="#161922" stroke="#262b38"/>
  <text x="140" y="386" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">append into parent</text>
  <text x="140" y="406" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">element: appendChild</text>
  <text x="140" y="422" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">comment: after() on microtask</text>

  <rect x="360" y="360" width="180" height="72" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="450" y="386" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">@if</text>
  <text x="450" y="406" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">one <!--if--></text>
  <text x="450" y="422" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">stamp first truthy body</text>

  <rect x="560" y="360" width="180" height="72" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="650" y="386" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">@for</text>
  <text x="650" y="406" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">one <!--for--></text>
  <text x="650" y="422" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">stamp body per entry</text>

  <rect x="80" y="456" width="600" height="100" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="380" y="480" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="13" font-weight="700">bindings live on component.reactiveElements</text>
  <text x="380" y="502" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">Text -&gt; interpolation    Element -&gt; dynamic attrs    Comment -&gt; if/for/props</text>
  <text x="380" y="522" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">@click is addEventListener once -- not in the Map</text>
  <text x="380" y="542" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">view.root is the top-level array bootstrap later appends</text>
</svg>
