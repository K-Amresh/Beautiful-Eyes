<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">Component construct, View bind, bootstrap append</title>
  <desc id="desc">Construction order: user @State, then View.buildNodeTree fills reactiveElements, then init hooks otherSubscriptions, then bootstrap appends view.root.</desc>
  <rect width="760" height="500" fill="#0f1115"/>

  <rect x="200" y="20" width="360" height="44" rx="8" fill="#161922" stroke="#262b38"/>
  <text x="380" y="48" text-anchor="middle" fill="#e7e9ee" font-family="SF Mono, Menlo, monospace" font-size="13">new Counter()</text>

  <line x1="380" y1="64" x2="380" y2="88" stroke="#7c9dff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="92" width="320" height="64" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="200" y="118" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. @State initializers</text>
  <text x="200" y="138" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">accessor and/or Proxy wrap</text>

  <rect x="400" y="92" width="320" height="64" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="560" y="118" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. view = new View(this)</text>
  <text x="560" y="138" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">buildNodeTree() immediately</text>

  <line x1="200" y1="156" x2="200" y2="176" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="560" y1="156" x2="560" y2="176" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="200" y1="176" x2="560" y2="176" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="380" y1="176" x2="380" y2="200" stroke="#7c9dff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="140" y="204" width="480" height="88" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="380" y="230" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="13" font-weight="700">reactiveElements Map fills as nodes are built</text>
  <text x="380" y="252" text-anchor="middle" fill="#9aa1b2" font-family="SF Mono, Menlo, monospace" font-size="11">Text -> interpolation updater</text>
  <text x="380" y="272" text-anchor="middle" fill="#9aa1b2" font-family="SF Mono, Menlo, monospace" font-size="11">Element -> dynamic attrs    Comment -> @if / @for / child</text>

  <line x1="380" y1="292" x2="380" y2="316" stroke="#7c9dff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="140" y="320" width="480" height="56" rx="8" fill="#161922" stroke="#262b38"/>
  <text x="380" y="344" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3. init() -> addOtherSubscription</text>
  <text x="380" y="362" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">otherSubscriptions walks reactiveElements.forEach(fn)</text>

  <line x1="380" y1="376" x2="380" y2="400" stroke="#7c9dff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="140" y="404" width="480" height="72" rx="8" fill="#2a3358" stroke="#7c9dff"/>
  <text x="380" y="432" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="13" font-weight="700">4. bootstrap(#root, instance)</text>
  <text x="380" y="454" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">DocumentFragment of view.root, then append. Directives splice on a microtask.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c9dff"/>
    </marker>
  </defs>
</svg>
