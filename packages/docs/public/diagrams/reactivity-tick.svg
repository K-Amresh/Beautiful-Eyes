<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">The notify tick: otherSubscriptions walks reactiveElements</title>
  <desc id="desc">A state write calls runSubscribers. After effects, the one otherSubscriptions callback iterates every updater in reactiveElements.</desc>
  <rect width="760" height="520" fill="#0f1115"/>
  <text x="380" y="28" text-anchor="middle" fill="#7c9dff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">this.count++ on this instance only</text>

  <rect x="200" y="44" width="360" height="44" rx="8" fill="#2a3358" stroke="#7c9dff"/>
  <text x="380" y="72" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="14" font-weight="700">runSubscribers()</text>

  <line x1="380" y1="88" x2="380" y2="112" stroke="#7c9dff" stroke-width="1.5"/>

  <rect x="40" y="116" width="300" height="56" rx="8" fill="#161922" stroke="#262b38"/>
  <text x="190" y="140" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. effectSubscribers</text>
  <text x="190" y="158" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">diff depFn arrays, maybe call effects</text>

  <rect x="420" y="116" width="300" height="56" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="570" y="140" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. otherSubscriptions</text>
  <text x="570" y="158" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">one fn, pushed by @Component init()</text>

  <line x1="190" y1="88" x2="190" y2="116" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="570" y1="88" x2="570" y2="116" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="190" y1="88" x2="570" y2="88" stroke="#7c9dff" stroke-width="1.5"/>

  <line x1="570" y1="172" x2="570" y2="196" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="380" y1="196" x2="570" y2="196" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="380" y1="196" x2="380" y2="216" stroke="#7c9dff" stroke-width="1.5"/>

  <rect x="80" y="220" width="600" height="64" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="380" y="246" text-anchor="middle" fill="#e7e9ee" font-family="SF Mono, Menlo, monospace" font-size="12">reactiveElements.forEach(fn =&gt; fn.call(this))</text>
  <text x="380" y="266" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">every binding on this instance - not a filtered subset</text>

  <line x1="140" y1="284" x2="140" y2="312" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="300" y1="284" x2="300" y2="312" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="460" y1="284" x2="460" y2="312" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="620" y1="284" x2="620" y2="312" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="140" y1="284" x2="620" y2="284" stroke="#7c9dff" stroke-width="1.5"/>

  <rect x="40" y="316" width="140" height="72" rx="8" fill="#161922" stroke="#262b38"/>
  <text x="110" y="344" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Text</text>
  <text x="110" y="364" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">textContent = fn()</text>

  <rect x="200" y="316" width="140" height="72" rx="8" fill="#161922" stroke="#262b38"/>
  <text x="270" y="344" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Element</text>
  <text x="270" y="364" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">dynamic attrs</text>

  <rect x="360" y="316" width="140" height="72" rx="8" fill="#161922" stroke="#262b38"/>
  <text x="430" y="344" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Comment if/for</text>
  <text x="430" y="364" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">remount / reconcile</text>

  <rect x="520" y="316" width="200" height="72" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="620" y="344" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Comment child</text>
  <text x="620" y="364" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="10">applyProps onto child</text>

  <rect x="80" y="412" width="600" height="84" rx="8" fill="#161922" stroke="#262b38"/>
  <text x="380" y="440" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Map key is the live DOM node</text>
  <text x="380" y="462" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="12">unMountNode deletes that key so a removed {count} stops updating</text>
  <text x="380" y="480" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="12">@click is not in the Map - listeners are bound once at mount</text>
</svg>
