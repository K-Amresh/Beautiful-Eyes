<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">State write to DOM update</title>
  <desc id="desc">A primitive write hits the accessor setter. An object write hits a Proxy trap. Both call runSubscribers on this instance only.</desc>
  <rect width="760" height="460" fill="#0f1115"/>
  <text x="380" y="28" text-anchor="middle" fill="#7c9dff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">a write on this instance</text>

  <rect x="40" y="48" width="300" height="72" rx="8" fill="#161922" stroke="#262b38"/>
  <text x="190" y="74" text-anchor="middle" fill="#e7e9ee" font-family="SF Mono, Menlo, monospace" font-size="13">this.count++</text>
  <text x="190" y="96" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="12">primitive @State - accessor setter</text>

  <rect x="420" y="48" width="300" height="72" rx="8" fill="#161922" stroke="#262b38"/>
  <text x="570" y="74" text-anchor="middle" fill="#e7e9ee" font-family="SF Mono, Menlo, monospace" font-size="13">this.user.name = 'Ada'</text>
  <text x="570" y="96" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="12">object @State - Proxy set trap</text>

  <line x1="190" y1="120" x2="190" y2="168" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="570" y1="120" x2="570" y2="168" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="190" y1="168" x2="570" y2="168" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="380" y1="168" x2="380" y2="196" stroke="#7c9dff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="220" y="200" width="320" height="56" rx="8" fill="#2a3358" stroke="#7c9dff"/>
  <text x="380" y="224" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="14" font-weight="700">runSubscribers()</text>
  <text x="380" y="242" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">this instance only - not a global bus</text>

  <line x1="380" y1="256" x2="380" y2="284" stroke="#7c9dff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="292" width="300" height="64" rx="8" fill="#161922" stroke="#262b38"/>
  <text x="190" y="318" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. effectSubscribers</text>
  <text x="190" y="338" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">diff depFn arrays, call changed effects</text>

  <rect x="420" y="292" width="300" height="64" rx="8" fill="#161922" stroke="#262b38"/>
  <text x="570" y="318" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. otherSubscriptions</text>
  <text x="570" y="338" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">component walks reactiveElements</text>

  <line x1="190" y1="256" x2="190" y2="292" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="570" y1="256" x2="570" y2="292" stroke="#7c9dff" stroke-width="1.5"/>
  <line x1="190" y1="256" x2="570" y2="256" stroke="#7c9dff" stroke-width="1.5"/>

  <line x1="570" y1="356" x2="570" y2="384" stroke="#7c9dff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="220" y="388" width="500" height="52" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="470" y="410" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="13" font-weight="700">every binding on this instance re-runs</text>
  <text x="470" y="428" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">text, attrs, @if, @for, $props - no per-field tracking</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c9dff"/>
    </marker>
  </defs>
</svg>
