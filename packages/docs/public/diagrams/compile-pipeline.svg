<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Template compile pipeline</title>
  <desc id="desc">A .template.be file is lexed, parsed into an AST, then stringified into a JS module that webpack treats as the import.</desc>
  <rect width="760" height="430" fill="#0f1115"/>

  <rect x="40" y="24" width="680" height="56" rx="8" fill="#161922" stroke="#262b38"/>
  <text x="380" y="48" text-anchor="middle" fill="#e7e9ee" font-family="SF Mono, Menlo, monospace" font-size="13">button.template.be</text>
  <text x="380" y="66" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">tags, {interpolations}, @if / @for, @event / $prop</text>

  <line x1="380" y1="80" x2="380" y2="108" stroke="#7c9dff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="112" width="680" height="56" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="380" y="136" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Lexer  |  lexer.ts</text>
  <text x="380" y="154" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">TAG_OPEN, INTERPOLATION, IF, FOR, ATTRIBUTE_NAME - context from the previous token</text>

  <line x1="380" y1="168" x2="380" y2="196" stroke="#7c9dff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="200" width="680" height="56" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="380" y="224" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Parser  |  parser.ts</text>
  <text x="380" y="242" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">AST: HtmlElement, Interpolation, StringNode, IfElse, For</text>

  <line x1="380" y1="256" x2="380" y2="284" stroke="#7c9dff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="288" width="680" height="56" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="380" y="312" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Stringify visitor</text>
  <text x="380" y="330" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">emits module.exports = [ HtmlObj | function | DirectiveObj, ... ]</text>

  <line x1="380" y1="344" x2="380" y2="372" stroke="#7c9dff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="376" width="680" height="40" rx="8" fill="#2a3358" stroke="#7c9dff"/>
  <text x="380" y="401" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="13">webpack import ->  component.template  (the compiled array)</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c9dff"/>
    </marker>
  </defs>
</svg>
