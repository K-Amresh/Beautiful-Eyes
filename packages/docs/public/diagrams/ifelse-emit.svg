<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">@if chain compiled to an array of condition and body pairs</title>
  <desc id="desc">Each @if and @else-if becomes a function plus a body array. @else is null plus a body. Runtime mounts only the first truthy index after a comment anchor.</desc>
  <rect width="760" height="430" fill="#0f1115"/>
  <text x="380" y="28" text-anchor="middle" fill="#7c9dff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">source ->  IfElse AST ->  emitted directive</text>

  <rect x="24" y="48" width="230" height="196" rx="8" fill="#161922" stroke="#262b38"/>
  <text x="139" y="76" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">.template.be</text>
  <text x="40" y="108" fill="#e7e9ee" font-family="SF Mono, Menlo, monospace" font-size="12">@if(even){</text>
  <text x="52" y="128" fill="#9aa1b2" font-family="SF Mono, Menlo, monospace" font-size="12">&lt;span&gt;even&lt;/span&gt;</text>
  <text x="40" y="148" fill="#e7e9ee" font-family="SF Mono, Menlo, monospace" font-size="12">}</text>
  <text x="40" y="176" fill="#e7e9ee" font-family="SF Mono, Menlo, monospace" font-size="12">@else{</text>
  <text x="52" y="196" fill="#9aa1b2" font-family="SF Mono, Menlo, monospace" font-size="12">&lt;span&gt;odd&lt;/span&gt;</text>
  <text x="40" y="216" fill="#e7e9ee" font-family="SF Mono, Menlo, monospace" font-size="12">}</text>

  <polygon points="268,146 292,134 292,158" fill="#7c9dff"/>

  <rect x="300" y="48" width="436" height="196" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="518" y="76" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="11">children: [ condition, body ][]</text>
  <text x="320" y="108" fill="#e7e9ee" font-family="SF Mono, Menlo, monospace" font-size="12">[ fn(){ return this.even },  [span even] ]</text>
  <text x="320" y="140" fill="#e7e9ee" font-family="SF Mono, Menlo, monospace" font-size="12">[ null,                     [span odd]  ]</text>
  <text x="320" y="184" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="12">name: 'ifElse'   type: DIRECTIVE</text>
  <text x="320" y="208" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="12">@else is the null condition - always matches last</text>

  <line x1="380" y1="244" x2="380" y2="276" stroke="#7c9dff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="80" y="284" width="600" height="120" rx="8" fill="#161922" stroke="#7c9dff"/>
  <text x="380" y="312" text-anchor="middle" fill="#e7e9ee" font-family="system-ui, sans-serif" font-size="13" font-weight="700">runtime  |  addIfElseDirective</text>
  <text x="380" y="338" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="12">insert &lt;!--if--&gt;   |   mount first truthy body   |   remember index</text>
  <text x="380" y="364" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="12">on notify: same index -> no DOM work</text>
  <text x="380" y="384" text-anchor="middle" fill="#9aa1b2" font-family="system-ui, sans-serif" font-size="12">different index -> unmount whole branch, mount the new one</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c9dff"/>
    </marker>
  </defs>
</svg>
